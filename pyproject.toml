[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dilute1"
version = "0.1.0"
description = "Train Dilute-1 from teacher-generated data without a separate student checkpoint"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=0.30",
  "datasets>=2.19",
  "safetensors>=0.4",
  "torch>=2.2",
  "tokenizers>=0.19",
  "tqdm>=4.66",
  "transformers>=4.43",
]

[project.scripts]
dilute1-generate = "dilute1.generate:main"
dilute1-chat = "dilute1.chat:main"
dilute1-pipeline = "dilute1.pipeline:main"
dilute1-wikitext = "dilute1.prepare_wikitext:main"
dilute1-train = "dilute1.train:main"
dilute1-tokenizer = "dilute1.tokenizer:main"

[tool.setuptools.packages.find]
where = ["src"]
